<template>
    <lightning-card title="Field Layout Finder">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Object API Name"
                value={objectApiName}
                onchange={handleObjectChange}>
            </lightning-input>

            <lightning-input
                label="Field API Name"
                value={fieldApiName}
                onchange={handleFieldChange}>
            </lightning-input>

            <lightning-button
                label="Find Layouts"
                variant="brand"
                class="slds-m-top_medium"
                onclick={handleSearch}>
            </lightning-button>

        </div>

        <template if:true={layoutNames.length}>

            <div class="slds-p-around_medium">

                <h3 class="slds-text-heading_small slds-m-bottom_small">
                    Layouts Containing Field
                </h3>

                <template for:each={layoutNames} for:item="layout">

                    <div key={layout} class="slds-box slds-m-bottom_x-small">
                        {layout}
                    </div>

                </template>

            </div>

        </template>

        <template if:true={errorMessage}>

            <div class="slds-p-around_medium slds-text-color_error">
                {errorMessage}
            </div>

        </template>

    </lightning-card>
</template>
