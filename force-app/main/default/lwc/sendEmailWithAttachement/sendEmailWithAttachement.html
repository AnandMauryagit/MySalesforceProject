<template>
    <div class="slds-p-around_medium lgc-bg">
        <lightning-input type="text"  label="Enter some text" onchange={recIds} ></lightning-input>
    </div>
        <lightning-button label="Open Modal" onclick={openModal}></lightning-button>
        <template if:true={isModalOpen}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Header -->
                    <header class="slds-modal__header">
                        <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={closeModal}
                            class="slds-modal__close"></lightning-button-icon>
                        <h2 class="slds-text-heading_medium">Modal Header</h2>
                    </header>
                    <!-- Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input type="text" label="Recipient Email" 
                            onchange={handleFirstInputChange}></lightning-input>
                        <lightning-input type="text" label="Subject" 
                            onchange={handleSecondInputChange}></lightning-input>
                        <lightning-input-rich-text label="Email body" 
                            onchange={handleRichTextChange}></lightning-input-rich-text>
                    </div>
                    <!-- Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-icon icon-name="action:delete" alternative-text="Delete" title="Delete" label= {filenametoShow}></lightning-icon>
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
</template>
